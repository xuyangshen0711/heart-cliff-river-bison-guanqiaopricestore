<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>启序 · 选款台</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{--pine:#1F3D34;--canvas:#EFE8DC;--paper:#F7F3EB;--ink:#1A1916;--muted:#6B655C;--line:#D9D0C3;--warn:#B42318;--gold:#C4A35A;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
header{background:var(--pine);color:#F4EFE6;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:18px}
header p{margin:2px 0 0;font-size:12px;opacity:.8}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600}
.primary{background:var(--gold);color:#1A1916}
.ghost{background:transparent;color:#F4EFE6;border:1px solid rgba(244,239,230,.35)}
.solid{background:var(--pine);color:#fff}
.danger{background:#fff;color:var(--warn);border:1px solid #E8C4C0}
.tiny{padding:4px 8px;font-size:11px;background:var(--canvas);color:var(--ink)}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.tabs,.seg{display:flex;gap:4px;background:var(--canvas);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button,.seg button{flex:1;background:transparent;color:var(--muted)}
.tabs button.on,.seg button.on{background:#fff;color:var(--pine);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
textarea,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;font-family:inherit;background:var(--canvas)}
textarea{min-height:110px;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.miss{color:var(--warn);font-size:13px;padding:6px 0}
.match{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ph{width:72px;height:90px;object-fit:contain;background:var(--canvas);border-radius:8px}
.draft-item{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.draft-item .nums{display:flex;gap:6px;align-items:center}
.draft-item input[type=number]{width:72px;padding:4px 6px}
.totals{display:flex;justify-content:space-between;margin-top:10px;font-weight:700}
.empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center}
h2{font-size:16px;color:var(--pine);margin:18px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sku{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sku .shot{height:160px;background:var(--canvas);display:flex;align-items:center;justify-content:center;position:relative}
.sku img{max-width:100%;max-height:100%;object-fit:contain}
.sku .meta{padding:8px}
.sku .meta b{display:block;font-size:13px}
.sku .meta span{font-size:12px;color:var(--muted)}
.noimg{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div>
    <h1>启序 · 选款台</h1>
    <p id="sub">26秋冬 · 单价默认不含税打包价，出表前可改</p>
  </div>
  <div class="actions">
    <button class="ghost" id="btnDemo">填入示例 4 款</button>
    <button class="ghost" id="btnPhotos">按款号补图</button>
    <button class="primary" id="btnExport">直接出表</button>
    <input id="photoFiles" type="file" accept="image/*" multiple hidden />
  </div>
</header>
<div class="wrap">
  <div class="tabs">
    <button class="on" data-tab="pick">选款出表</button>
    <button data-tab="all">全部款</button>
  </div>
  <div class="seg">
    <button class="on" data-season="all">秋+冬</button>
    <button data-season="26秋">26秋</button>
    <button data-season="26冬">26冬</button>
  </div>
  <div id="viewPick" class="grid2">
    <section class="card">
      <label>客户名称</label>
      <input id="customer" type="text" value="客户" />
      <div style="height:10px"></div>
      <label>客户看中的款号（换行 / 逗号都可以）</label>
      <textarea id="query" placeholder="例如：&#10;886C001&#10;886D006&#10;85K001"></textarea>
      <div class="row">
        <button class="solid" id="btnAdd">把匹配款全色加入草稿</button>
        <span class="hint">对不上标红 · 886116TQ 也能搜到 886C116TQ</span>
      </div>
      <div id="matches"></div>
    </section>
    <section class="card">
      <label>报价草稿 · 单价可改（不含税打包价起）</label>
      <div id="draft"></div>
      <div class="totals"><span id="sumLine">0 款 · 0 个色 · 0 件</span><span id="sumMoney">¥0</span></div>
      <div class="row"><button class="danger" id="btnClear">清空草稿</button></div>
    </section>
  </div>
  <div id="viewAll" hidden></div>
</div>

const LS_ROT = 'qixu-rot-v1';
const LS_PHOTO = 'qixu-photo-v1';
function loadMap(key){ try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return {}} }
function saveMap(key,obj){ try{localStorage.setItem(key,JSON.stringify(obj))}catch(e){} }
let rotations = loadMap(LS_ROT);
let extraPhotos = loadMap(LS_PHOTO);
let season = 'all';
let tab = 'pick';
let draft = [];

function norm(s){return String(s||'').toUpperCase().replace(/[\s\-_()（）]/g,'')}
function keysOf(s){return [s.code,...(s.aliases||[])]}
function findStyle(q){
  const nq=norm(q); if(!nq) return null;
  for(const s of CATALOG.styles){ if(keysOf(s).some(k=>norm(k)===nq)) return s }
  for(const s of CATALOG.styles){ if(keysOf(s).some(k=>{const nk=norm(k);return nk.includes(nq)||nq.includes(nk)})) return s }
  return null;
}
function photoOf(s){ return extraPhotos[s.code] || s.photo || '' }
function rotOf(s){ return Number(rotations[s.code]||0)%360 }
function setRot(code,deg){ rotations[code]=((deg%360)+360)%360; saveMap(LS_ROT,rotations) }

function imgTag(s, cls){
  const src=photoOf(s); const r=rotOf(s);
  if(!src) return `<div class="${cls} noimg">无图</div>`;
  return `<img class="${cls}" src="${src}" alt="${s.code}" style="transform:rotate(${r}deg)" />`;
}

function visible(){
  return season==='all' ? CATALOG.styles : CATALOG.styles.filter(s=>s.season===season);
}

function tokens(text){ return text.split(/[\s,，、;；]+/).map(t=>t.trim()).filter(Boolean) }

function renderMatches(){
  const qs=tokens(document.getElementById('query').value);
  const box=document.getElementById('matches');
  if(!qs.length){ box.innerHTML='<p class="empty">贴款号，或打开「全部款」点图加入。</p>'; return }
  const seen=new Set(); let html='';
  for(const q of qs){
    const s=findStyle(q);
    if(!s){ html+=`<p class="miss">未找到：${q}</p>`; continue }
    if(seen.has(s.code)) continue; seen.add(s.code);
    html+=`<article class="match">${imgTag(s,'ph')}
      <div>
        <div><b>${s.code}</b> · ${s.season} · ${s.category}
          ${s.price!=null?`<span> · 打包价 ¥${s.price}</span>`:''}</div>
        <div class="hint">${s.sizeRange} · ${s.composition||''}</div>
        <div class="row">${s.colors.map(c=>`<button class="tiny" data-add="${s.code}" data-color="${c}">${c}</button>`).join('')}
          <button class="tiny" data-rot="${s.code}">旋转</button>
        </div>
      </div></article>`
  }
  box.innerHTML=html;
}

function money(){ return draft.reduce((a,b)=>a+(Number(b.price)||0)*(Number(b.qty)||0),0) }
function renderDraft(){
  const box=document.getElementById('draft');
  if(!draft.length){ box.innerHTML='<p class="empty">还没有草稿。</p>' }
  else{
    box.innerHTML=draft.map((d,i)=>{
      const s=findStyle(d.code)||{code:d.code,photo:d.photo};
      return `<div class="draft-item">${imgTag(s,'ph')}
        <div><b>${d.code} · ${d.color}</b><div class="hint">${d.sizeRange||''}</div></div>
        <div class="nums">
          <label style="margin:0">单价<input type="number" min="0" step="1" value="${d.price}" data-price="${i}" /></label>
          <label style="margin:0">件<input type="number" min="1" value="${d.qty}" data-qty="${i}" /></label>
          <button class="tiny" data-del="${i}">删</button>
        </div></div>`
    }).join('');
  }
  const styles=new Set(draft.map(d=>d.code)).size;
  const qty=draft.reduce((a,b)=>a+(Number(b.qty)||0),0);
  document.getElementById('sumLine').textContent=`${styles} 款 · ${draft.length} 个色 · ${qty} 件`;
  document.getElementById('sumMoney').textContent='¥'+money();
}

function addStyle(s, color){
  const colors = color ? [color] : (s.colors.length?s.colors:['默认']);
  for(const c of colors){
    const id=s.code+'::'+c;
    const exist=draft.find(d=>d.id===id);
    if(exist) exist.qty = Number(exist.qty||1)+1;
    else draft.push({
      id, code:s.code, color:c, qty:1,
      price:s.price||0, sizeRange:s.sizeRange||'',
      composition:s.composition||'', weight:s.weight||'',
      standard:s.standard||'', safety:s.safety||'',
      note:s.note||'', photo:photoOf(s), category:s.category||''
    });
  }
  renderDraft();
}

function groupHTML(){
  const order=['上衣','套装','马甲','裙装','内搭','裤子'];
  const seasons=['26秋','26冬'];
  let html='';
  const list=visible();
  for(const se of seasons){
    const bucket=list.filter(s=>s.season===se);
    const cats=[...new Set(bucket.map(s=>s.category))].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
    for(const cat of cats){
      const items=bucket.filter(s=>s.category===cat);
      if(!items.length) continue;
      html+=`<h2>${se} · ${cat} ${items.length}</h2><div class="cards">`;
      for(const s of items){
        html+=`<article class="sku">
          <div class="shot" data-add="${s.code}">${imgTag(s,'')}</div>
          <div class="meta"><b>${s.code}</b>
            <span>${s.price!=null?'¥'+s.price:'—'} · ${s.colors.length} 色</span>
            <div class="row">
              <button class="tiny" data-add="${s.code}">加入全色</button>
              <button class="tiny" data-rot="${s.code}">旋转</button>
            </div>
          </div></article>`
      }
      html+='</div>';
    }
  }
  return html || '<p class="empty">这一季没有款。</p>';
}

function renderAll(){ document.getElementById('viewAll').innerHTML=groupHTML() }
function render(){
  document.getElementById('sub').textContent=`26秋冬已预装 · ${CATALOG.styles.length} 款 · 单价默认为不含税打包价，出表前可改`;
  if(tab==='pick'){ document.getElementById('viewPick').hidden=false; document.getElementById('viewAll').hidden=true; renderMatches(); renderDraft(); }
  else { document.getElementById('viewPick').hidden=true; document.getElementById('viewAll').hidden=false; renderAll(); }
}

document.querySelector('.tabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  tab=b.dataset.tab; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); render();
});
document.querySelector('.seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  season=b.dataset.season; document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b)); render();
});
document.getElementById('query').addEventListener('input',renderMatches);
document.getElementById('btnDemo').onclick=()=>{
  document.getElementById('query').value='886C001\\n886D006\\n886C232K\\n85K001';
  tab='pick'; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='pick'));
  render();
};
document.getElementById('btnAdd').onclick=()=>{
  const qs=tokens(document.getElementById('query').value);
  const seen=new Set();
  for(const q of qs){ const s=findStyle(q); if(s&&!seen.has(s.code)){ seen.add(s.code); addStyle(s) } }
};
document.getElementById('btnClear').onclick=()=>{ draft=[]; renderDraft() };
document.getElementById('btnPhotos').onclick=()=>document.getElementById('photoFiles').click();
document.getElementById('photoFiles').onchange=async ev=>{
  const files=[...ev.target.files]; ev.target.value='';
  let ok=0, miss=0;
  for(const f of files){
    const stem=f.name.replace(/\\.[^.]+$/,'').toUpperCase().replace(/[\\s_-]+/g,'');
    const s=CATALOG.styles.find(st=>keysOf(st).some(k=>{
      const nk=norm(k); return nk && (stem===nk || stem.startsWith(nk));
    }));
    if(!s){ miss++; continue }
    extraPhotos[s.code]=await compressFile(f);
    saveMap(LS_PHOTO, extraPhotos); ok++;
  }
  alert(ok?`补上 ${ok} 张图`+(miss?`，${miss} 张文件名对不上款号`:''):'文件名里要有款号，例如 886C001.jpg');
  render();
};

document.body.addEventListener('click',e=>{
  const rot=e.target.closest('[data-rot]');
  if(rot){ const code=rot.dataset.rot; setRot(code, rotOf({code})+90); render(); return; }
  const add=e.target.closest('[data-add]');
  if(add){ const s=findStyle(add.dataset.add); if(s) addStyle(s, add.dataset.color); }
  const del=e.target.closest('[data-del]');
  if(del){ draft.splice(Number(del.dataset.del),1); renderDraft(); }
});
document.body.addEventListener('input',e=>{
  if(e.target.dataset.price!=null){ draft[Number(e.target.dataset.price)].price=Number(e.target.value)||0; document.getElementById('sumMoney').textContent='¥'+money(); }
  if(e.target.dataset.qty!=null){ draft[Number(e.target.dataset.qty)].qty=Math.max(1,Number(e.target.value)||1); renderDraft(); }
});

async function compressFile(file){
  const bmp=await createImageBitmap(file);
  const max=420; const scale=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.78);
}

async function rotatedDataURL(src, deg){
  if(!src) return null;
  const img=new Image(); img.crossOrigin='anonymous';
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=src; });
  const r=((deg%360)+360)%360;
  const c=document.createElement('canvas');
  if(r===90||r===270){ c.width=img.height; c.height=img.width; }
  else { c.width=img.width; c.height=img.height; }
  const ctx=c.getContext('2d');
  ctx.translate(c.width/2,c.height/2); ctx.rotate(r*Math.PI/180);
  ctx.drawImage(img,-img.width/2,-img.height/2);
  return c.toDataURL('image/jpeg',0.82).split(',')[1];
}

document.getElementById('btnExport').onclick=async ()=>{
  const qs=tokens(document.getElementById('query').value);
  let lines=draft.slice();
  if(!lines.length){
    const seen=new Set();
    for(const q of qs){
      const s=findStyle(q); if(!s||seen.has(s.code)) continue; seen.add(s.code);
      for(const c of (s.colors.length?s.colors:['默认'])){
        lines.push({code:s.code,color:c,qty:1,price:s.price||0,sizeRange:s.sizeRange,composition:s.composition,weight:'',standard:s.standard,safety:s.safety,note:s.note,photo:photoOf(s)});
      }
    }
  }
  if(!lines.length){ alert('先贴款号或加入草稿'); return; }
  const wb=new ExcelJS.Workbook(); const ws=wb.addWorksheet('报价');
  ws.addRow(['图片','款号','颜色','尺码段','S','M','L','XL','XXL','件数','不含税单价','金额','成份','克重','执行标准','安全类别','备注']);
  ws.getRow(1).font={bold:true,color:{argb:'FFF4EFE6'},name:'微软雅黑',size:10};
  ws.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F3D34'}};
  ws.columns=[{width:14},{width:16},{width:12},{width:10},{width:6},{width:6},{width:6},{width:6},{width:6},{width:8},{width:12},{width:10},{width:42},{width:10},{width:18},{width:20},{width:22}];
  const groups=[];
  for(const d of lines){
    const last=groups[groups.length-1];
    if(!last||last.code!==d.code) groups.push({code:d.code,items:[d]});
    else last.items.push(d);
  }
  let r=2;
  for(const g of groups){
    const s=findStyle(g.code);
    const b64=await rotatedDataURL(photoOf(s||{code:g.code,photo:g.items[0].photo}), rotOf(s||{code:g.code}));
    let imgId=null;
    if(b64) imgId=wb.addImage({base64:b64,extension:'jpeg'});
    for(let i=0;i<g.items.length;i++){
      const d=g.items[i]; const qty=Number(d.qty)||1; const price=Number(d.price)||0;
      ws.addRow(['', i===0?d.code:'', d.color, i===0?(d.sizeRange||''):'', '', '', '', '', '', qty, price, qty*price, i===0?(d.composition||''):'', '', i===0?(d.standard||''):'', i===0?(d.safety||''):'', i===0?(d.note||''):'']);
      ws.getRow(r).height=72;
      r++;
    }
    if(imgId!=null) ws.addImage(imgId,{tl:{col:0,row:r-g.items.length-1},ext:{width:90,height:90}});
  }
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');
  const name=(document.getElementById('customer').value||'客户')+'-报价.xlsx';
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
};

render();
</script>
